name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install ruff pytest pytest-cov hypothesis

      - name: Lint with Ruff
        run: |
          ruff check server vision

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=server/app/core --cov-report=term-missing --cov-fail-under=80 server/tests

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package.json

      - name: Install web dependencies
        run: |
          cd web
          npm ci

      - name: Web Lint & Typecheck
        run: |
          cd web
          npm run lint || true

      - name: Run Web Unit Tests (Vitest)
        run: |
          cd web
          npm test -- --run

      - name: Build Web Application
        run: |
          cd web
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Build
        run: |
          docker compose build api web
